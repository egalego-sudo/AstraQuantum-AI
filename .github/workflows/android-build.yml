name: ASTRA Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "backend/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build ASTRA APKs
    runs-on: ubuntu-latest
    env:
      ASTRA_KEYSTORE_BASE64: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
      ASTRA_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
      ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
      ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create changed-files source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess, zipfile
          from pathlib import Path
          out = Path('patch-output')
          out.mkdir(exist_ok=True)
          raw = subprocess.check_output(['git', 'diff', '--name-status', '-z', 'HEAD^', 'HEAD'])
          parts = raw.decode('utf-8', 'surrogateescape').split(chr(0))
          entries, i = [], 0
          while i < len(parts) and parts[i]:
              status = parts[i]; i += 1
              if status.startswith(('R', 'C')):
                  old, new = parts[i], parts[i+1]; i += 2
                  entries.append((status, old, new))
              else:
                  name = parts[i]; i += 1
                  entries.append((status, name, name))
          manifest = ['ASTRA QUANTUM AI PLUS - SOURCE PATCH', '', 'Overlay included files onto the same repository root.', 'Deleted files are listed below and must be removed manually if applying by hand.', '']
          included = []
          with zipfile.ZipFile(out / 'ASTRA-SOURCE-PATCH.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for status, old, new in entries:
                  if status.startswith('D'):
                      manifest.append(f'DELETED: {old}')
                      continue
                  if new.startswith('.git/') or Path(new).name in ('.env', '.env.local') or new.endswith(('.jks', '.keystore')):
                      manifest.append(f'SKIPPED (sensitive): {new}')
                      continue
                  p = Path(new)
                  if p.is_file():
                      z.write(p, new)
                      included.append(new)
                      manifest.append(f'INCLUDED: {new}')
              z.writestr('PATCH-MANIFEST.txt', chr(10).join(manifest) + chr(10))
          print('Patch files:', len(included))
          print('Patch archive:', out / 'ASTRA-SOURCE-PATCH.zip')
          PY

      - name: Upload changed-files source patch
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-SOURCE-PATCH
          path: patch-output/ASTRA-SOURCE-PATCH.zip
          if-no-files-found: error
          retention-days: 90

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check backend JavaScript syntax
        run: node --check backend/server.js

      - name: Install Android NDK and CMake for BSDIFF engine
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Export trusted update signer certificate for app
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore" app/src/main/assets
          echo "$ASTRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/astra-upload.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/keystore/astra-upload.jks" -storepass "$ASTRA_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore/cert-list.txt"
          alias="$(sed -n 's/^Alias name: //p' "$RUNNER_TEMP/keystore/cert-list.txt" | head -n 1)"
          test -n "$alias"
          echo "ASTRA_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          keytool -exportcert -rfc -alias "$alias" -keystore "$RUNNER_TEMP/keystore/astra-upload.jks" -storepass "$ASTRA_KEYSTORE_PASSWORD" -file app/src/main/assets/update_signer.pem
          test -s app/src/main/assets/update_signer.pem
          echo "Embedded public update-verification certificate exported."

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # Keep a usable debug build available even if release signing needs repair.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-QUANTUM-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare persistent release signing key
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ASTRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/astra-upload.jks"
          test -s "$RUNNER_TEMP/keystore/astra-upload.jks"

      - name: Validate persistent release signing credentials
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        shell: bash
        run: |
          # Discover the real alias from the keystore instead of trusting a possibly stale alias secret.
          if ! keytool -list -v -keystore "$RUNNER_TEMP/keystore/astra-upload.jks" -storepass "$ASTRA_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore/list.txt" 2> "$RUNNER_TEMP/keystore/list-error.txt"; then
            echo "::error::The GitHub ASTRA_KEYSTORE_PASSWORD secret does not unlock this keystore. The alias was not the cause."
            exit 1
          fi
          alias="$(sed -n 's/^Alias name: //p' "$RUNNER_TEMP/keystore/list.txt" | head -n 1)"
          if [ -z "$alias" ]; then
            echo "::error::The keystore opened, but no private-key alias was found."
            exit 1
          fi
          echo "Detected signing alias: $alias"
          echo "ASTRA_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          # Do not use keytool -keypasswd as a password probe: it is unsupported
          # for PKCS12 keystores on some JDKs. Gradle's release signing task is
          # the authoritative check for the private-key password.
          rm -f "$RUNNER_TEMP/keystore/list.txt" "$RUNNER_TEMP/keystore/list-error.txt"
          echo "Keystore password and signing alias validated; Gradle will verify the private-key password during assembleRelease."

      - name: Build permanently signed release APK
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        env:
          ASTRA_KEYSTORE_PATH: ${{ runner.temp }}/keystore/astra-upload.jks
        run: gradle --no-daemon assembleRelease

      - name: Upload signed update APK
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-QUANTUM-AI-signed-update-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
      # Build a delta only against the exact previous signed APK artifact.
      # This patch targets build #122; devices on other builds must not apply it.
      - name: Download previous signed APK (build 122)
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        uses: actions/download-artifact@v4
        with:
          name: ASTRA-QUANTUM-AI-signed-update-apk
          path: previous-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43888830737

      - name: Create and verify APK binary delta
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bsdiff
          OLD_APK="$(find previous-release -type f -name '*.apk' -print -quit)"
          NEW_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$OLD_APK" && test -n "$NEW_APK"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$TOOLS"
          "$TOOLS" verify --print-certs "$OLD_APK" > old-cert.txt
          "$TOOLS" verify --print-certs "$NEW_APK" > new-cert.txt
          OLD_CERT="$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' old-cert.txt | head -n 1)"
          NEW_CERT="$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' new-cert.txt | head -n 1)"
          test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT"
          mkdir -p delta-output
          bsdiff "$OLD_APK" "$NEW_APK" delta-output/ASTRA-build122-to-current.patch
          bspatch "$OLD_APK" delta-output/reconstructed.apk delta-output/ASTRA-build122-to-current.patch
          cmp "$NEW_APK" delta-output/reconstructed.apk
          OLD_HASH="$(sha256sum "$OLD_APK" | cut -d ' ' -f 1)"
          NEW_HASH="$(sha256sum "$NEW_APK" | cut -d ' ' -f 1)"
          REBUILT_HASH="$(sha256sum delta-output/reconstructed.apk | cut -d ' ' -f 1)"
          test "$NEW_HASH" = "$REBUILT_HASH"
          python3 - "$OLD_HASH" "$NEW_HASH" "$OLD_CERT" "$OLD_APK" "$NEW_APK" <<'PY'
          import json, os, sys
          old_hash, new_hash, signer, old_path, new_path = sys.argv[1:]
          metadata = {
            "packageName": "com.bittupandit.astraquantumai",
            "baseBuild": 122,
            "targetBuild": int(os.environ.get("GITHUB_RUN_NUMBER", "0")),
            "baseApkSha256": old_hash,
            "targetApkSha256": new_hash,
            "signerCertificateSha256": signer,
            "patchFile": "ASTRA-build122-to-current.patch",
            "note": "Targets only the exact build-122 APK whose SHA-256 matches baseApkSha256."
          }
          with open("delta-output/UPDATE-METADATA.json", "w") as f:
            json.dump(metadata, f, indent=2)
          print("Old APK bytes:", os.path.getsize(old_path))
          print("New APK bytes:", os.path.getsize(new_path))
          print("Delta bytes:", os.path.getsize("delta-output/ASTRA-build122-to-current.patch"))
          print("Round-trip SHA-256 verified:", new_hash)
          PY

      - name: Create and sign update metadata
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        shell: bash
        env:
          ASTRA_KEYSTORE_PATH: ${{ runner.temp }}/keystore/astra-upload.jks
        run: |
          set -euo pipefail
          NEW_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          cp "$NEW_APK" delta-output/ASTRA-QUANTUM-AI.apk
          TAG="astra-build-${GITHUB_RUN_NUMBER}"
          python3 - "$TAG" <<'PY'
          import json, os, sys
          tag = sys.argv[1]
          base = "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/releases/download/" + tag + "/"
          data = {
            "packageName": "com.bittupandit.astraquantumai",
            "baseBuild": 122,
            "targetVersionCode": int(os.environ["GITHUB_RUN_NUMBER"]),
            "targetVersionName": "1.0." + os.environ["GITHUB_RUN_NUMBER"],
            "baseApkSha256": os.environ["OLD_HASH"] if "OLD_HASH" in os.environ else "",
            "targetApkSha256": os.environ["NEW_HASH"] if "NEW_HASH" in os.environ else "",
            "signerCertificateSha256": os.environ["SIGNER_SHA256"] if "SIGNER_SHA256" in os.environ else "",
            "patchUrl": base + "ASTRA-build122-to-current.patch",
            "apkUrl": base + "ASTRA-QUANTUM-AI.apk"
          }
          # Recompute hashes from the verified files and signer certificate.
          import hashlib, glob, subprocess
          old = glob.glob("previous-release/**/*.apk", recursive=True)[0]
          new = glob.glob("app/build/outputs/apk/release/**/*.apk", recursive=True)[0]
          data["baseApkSha256"] = hashlib.sha256(open(old, "rb").read()).hexdigest()
          data["targetApkSha256"] = hashlib.sha256(open(new, "rb").read()).hexdigest()
          cert = subprocess.check_output(["openssl", "x509", "-in", "app/src/main/assets/update_signer.pem", "-outform", "DER"])
          data["signerCertificateSha256"] = hashlib.sha256(cert).hexdigest()
          with open("delta-output/UPDATE-METADATA.json", "w") as f:
            json.dump(data, f, separators=(",", ":"), sort_keys=True)
          PY
          cat > "$RUNNER_TEMP/SignUpdateMetadata.java" <<'JAVA'
          import java.nio.file.*;
          import java.security.*;
          import java.security.cert.*;
          import java.util.Base64;
          import java.io.*;
          public class SignUpdateMetadata {
            public static void main(String[] a) throws Exception {
              String path=a[0], storePass=a[1], alias=a[2], keyPass=a[3], meta=a[4], sigOut=a[5];
              KeyStore ks=null; Exception last=null;
              for (String type : new String[]{"PKCS12","JKS"}) {
                try { ks=KeyStore.getInstance(type); try(InputStream in=new FileInputStream(path)){ks.load(in,storePass.toCharArray());} break; }
                catch(Exception e){last=e;ks=null;}
              }
              if(ks==null) throw last;
              PrivateKey key=(PrivateKey)ks.getKey(alias,keyPass.toCharArray());
              String alg=key.getAlgorithm().equalsIgnoreCase("RSA")?"SHA256withRSA":"SHA256withECDSA";
              Signature signer=Signature.getInstance(alg);
              signer.initSign(key);
              signer.update(Files.readAllBytes(Path.of(meta)));
              Files.writeString(Path.of(sigOut), Base64.getEncoder().encodeToString(signer.sign()));
            }
          }
          JAVA
          javac "$RUNNER_TEMP/SignUpdateMetadata.java"
          java -cp "$RUNNER_TEMP" SignUpdateMetadata "$ASTRA_KEYSTORE_PATH" "$ASTRA_KEYSTORE_PASSWORD" "$ASTRA_KEY_ALIAS" "$ASTRA_KEY_PASSWORD" delta-output/UPDATE-METADATA.json delta-output/UPDATE-METADATA.sig
          openssl x509 -in app/src/main/assets/update_signer.pem -pubkey -noout > "$RUNNER_TEMP/update-public.pem"
          base64 -d delta-output/UPDATE-METADATA.sig > "$RUNNER_TEMP/update-signature.bin"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/update-public.pem" -signature "$RUNNER_TEMP/update-signature.bin" delta-output/UPDATE-METADATA.json
          echo "Signed update metadata signature verified against embedded app certificate."

      - name: Publish verified update release
        if: github.ref == 'refs/heads/main' && env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="astra-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            delta-output/ASTRA-build122-to-current.patch \
            delta-output/UPDATE-METADATA.json \
            delta-output/UPDATE-METADATA.sig \
            delta-output/ASTRA-QUANTUM-AI.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "ASTRA QUANTUM AI PLUS Build ${GITHUB_RUN_NUMBER}" \
            --notes "Signed update for ASTRA QUANTUM AI PLUS. The app verifies metadata signature, package ID, APK hash, version and signing certificate before showing Android's installer." \
            --latest --target "$GITHUB_SHA"

      - name: Upload verified APK binary delta
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-QUANTUM-AI-APK-DELTA-build122
          path: |
            delta-output/ASTRA-build122-to-current.patch
            delta-output/UPDATE-METADATA.json
            delta-output/UPDATE-METADATA.sig
            delta-output/ASTRA-QUANTUM-AI.apk
          if-no-files-found: error
          retention-days: 90
