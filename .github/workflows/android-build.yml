name: ASTRA Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "backend/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ASTRA APKs
    runs-on: ubuntu-latest
    env:
      ASTRA_KEYSTORE_BASE64: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
      ASTRA_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
      ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
      ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check backend JavaScript syntax
        run: node --check backend/server.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # Keep a usable debug build available even if release signing needs repair.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-QUANTUM-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare persistent release signing key
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_ALIAS != '' && env.ASTRA_KEY_PASSWORD != ''
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ASTRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/astra-upload.jks"
          test -s "$RUNNER_TEMP/keystore/astra-upload.jks"

      - name: Validate persistent release signing credentials
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_ALIAS != '' && env.ASTRA_KEY_PASSWORD != ''
        run: |
          if ! keytool -list -keystore "$RUNNER_TEMP/keystore/astra-upload.jks" -storepass "$ASTRA_KEYSTORE_PASSWORD" -alias "$ASTRA_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore password or alias does not match the uploaded keystore."
            exit 1
          fi
          cp "$RUNNER_TEMP/keystore/astra-upload.jks" "$RUNNER_TEMP/keystore/credential-check.jks"
          if ! keytool -keypasswd -alias "$ASTRA_KEY_ALIAS" -keystore "$RUNNER_TEMP/keystore/credential-check.jks" -storepass "$ASTRA_KEYSTORE_PASSWORD" -keypass "$ASTRA_KEY_PASSWORD" -new "$ASTRA_KEY_PASSWORD" >/dev/null 2>&1; then
            echo "::error::The key password does not match the selected alias."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/keystore/credential-check.jks"
          echo "Persistent signing credentials validated successfully."

      - name: Build permanently signed release APK
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_ALIAS != '' && env.ASTRA_KEY_PASSWORD != ''
        env:
          ASTRA_KEYSTORE_PATH: ${{ runner.temp }}/keystore/astra-upload.jks
        run: gradle --no-daemon assembleRelease

      - name: Upload signed update APK
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_ALIAS != '' && env.ASTRA_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-QUANTUM-AI-signed-update-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
