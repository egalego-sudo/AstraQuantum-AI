name: ASTRA Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "backend/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ASTRA APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check backend JavaScript syntax
        run: node --check backend/server.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare persistent release signing key
        if: ${{ secrets.ASTRA_KEYSTORE_BASE64 != '' && secrets.ASTRA_KEYSTORE_PASSWORD != '' && secrets.ASTRA_KEY_ALIAS != '' && secrets.ASTRA_KEY_PASSWORD != '' }}
        env:
          ASTRA_KEYSTORE_BASE64: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ASTRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/astra-upload.jks"
          test -s "$RUNNER_TEMP/keystore/astra-upload.jks"

      - name: Build permanently signed release APK
        if: ${{ secrets.ASTRA_KEYSTORE_BASE64 != '' && secrets.ASTRA_KEYSTORE_PASSWORD != '' && secrets.ASTRA_KEY_ALIAS != '' && secrets.ASTRA_KEY_PASSWORD != '' }}
        env:
          ASTRA_KEYSTORE_PATH: ${{ runner.temp }}/keystore/astra-upload.jks
          ASTRA_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
          ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
          ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-QUANTUM-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed update APK
        if: ${{ secrets.ASTRA_KEYSTORE_BASE64 != '' && secrets.ASTRA_KEYSTORE_PASSWORD != '' && secrets.ASTRA_KEY_ALIAS != '' && secrets.ASTRA_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-QUANTUM-AI-signed-update-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
