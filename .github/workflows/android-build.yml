name: ASTRA Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "ApkPatchLibrary/**"
      - "backend/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

# Keep only one APK pipeline active; a newer fix supersedes a stuck run.
concurrency:
  group: astra-android-build-v4
  cancel-in-progress: true

jobs:
  build:
    name: Build ASTRA APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASTRA_KEYSTORE_BASE64: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
      ASTRA_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
      ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
      ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create changed-files source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess, zipfile
          from pathlib import Path
          out = Path('patch-output')
          out.mkdir(exist_ok=True)
          raw = subprocess.check_output(['git', 'diff', '--name-status', '-z', 'HEAD^', 'HEAD'])
          parts = raw.decode('utf-8', 'surrogateescape').split(chr(0))
          entries, i = [], 0
          while i < len(parts) and parts[i]:
              status = parts[i]; i += 1
              if status.startswith(('R', 'C')):
                  old, new = parts[i], parts[i+1]; i += 2
                  entries.append((status, old, new))
              else:
                  name = parts[i]; i += 1
                  entries.append((status, name, name))
          manifest = ['ASTRA QUANTUM AI PLUS - SOURCE PATCH', '', 'Overlay included files onto the same repository root.', 'Deleted files are listed below and must be removed manually if applying by hand.', '']
          included = []
          with zipfile.ZipFile(out / 'ASTRA-SOURCE-PATCH.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for status, old, new in entries:
                  if status.startswith('D'):
                      manifest.append(f'DELETED: {old}')
                      continue
                  if new.startswith('.git/') or Path(new).name in ('.env', '.env.local') or new.endswith(('.jks', '.keystore')):
                      manifest.append(f'SKIPPED (sensitive): {new}')
                      continue
                  p = Path(new)
                  if p.is_file():
                      z.write(p, new)
                      included.append(new)
                      manifest.append(f'INCLUDED: {new}')
              z.writestr('PATCH-MANIFEST.txt', chr(10).join(manifest) + chr(10))
          print('Patch files:', len(included))
          print('Patch archive:', out / 'ASTRA-SOURCE-PATCH.zip')
          PY

      - name: Upload changed-files source patch
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-SOURCE-PATCH
          path: patch-output/ASTRA-SOURCE-PATCH.zip
          if-no-files-found: error
          retention-days: 90

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check backend JavaScript syntax
        run: node --check backend/server.js

      - name: Run backend unit tests
        run: npm test --prefix backend

      - name: Install Android NDK and CMake for BSDIFF engine
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Export trusted update signer certificate for app
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore" app/src/main/assets
          echo "$ASTRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/astra-upload.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/keystore/astra-upload.jks" -storepass "$ASTRA_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore/cert-list.txt"
          alias="$(sed -n 's/^Alias name: //p' "$RUNNER_TEMP/keystore/cert-list.txt" | head -n 1)"
          test -n "$alias"
          echo "ASTRA_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          keytool -exportcert -rfc -alias "$alias" -keystore "$RUNNER_TEMP/keystore/astra-upload.jks" -storepass "$ASTRA_KEYSTORE_PASSWORD" -file app/src/main/assets/update_signer.pem
          test -s app/src/main/assets/update_signer.pem
          echo "Embedded public update-verification certificate exported."

      # Android unit tests are run and required by the dedicated QUANTUM AI Capability CI workflow.
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # Keep a usable debug build available even if release signing needs repair.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-QUANTUM-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare persistent release signing key
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ASTRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/astra-upload.jks"
          test -s "$RUNNER_TEMP/keystore/astra-upload.jks"

      - name: Validate persistent release signing credentials
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        shell: bash
        run: |
          # Discover the real alias from the keystore instead of trusting a possibly stale alias secret.
          if ! keytool -list -v -keystore "$RUNNER_TEMP/keystore/astra-upload.jks" -storepass "$ASTRA_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore/list.txt" 2> "$RUNNER_TEMP/keystore/list-error.txt"; then
            echo "::error::The GitHub ASTRA_KEYSTORE_PASSWORD secret does not unlock this keystore. The alias was not the cause."
            exit 1
          fi
          alias="$(sed -n 's/^Alias name: //p' "$RUNNER_TEMP/keystore/list.txt" | head -n 1)"
          if [ -z "$alias" ]; then
            echo "::error::The keystore opened, but no private-key alias was found."
            exit 1
          fi
          echo "Detected signing alias: $alias"
          echo "ASTRA_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          # Do not use keytool -keypasswd as a password probe: it is unsupported
          # for PKCS12 keystores on some JDKs. Gradle's release signing task is
          # the authoritative check for the private-key password.
          rm -f "$RUNNER_TEMP/keystore/list.txt" "$RUNNER_TEMP/keystore/list-error.txt"
          echo "Keystore password and signing alias validated; Gradle will verify the private-key password during assembleRelease."

      - name: Build permanently signed release APK
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        timeout-minutes: 20
        env:
          ASTRA_KEYSTORE_PATH: ${{ runner.temp }}/keystore/astra-upload.jks
        run: gradle --no-daemon --no-parallel --max-workers=1 --console=plain --stacktrace assembleRelease

      - name: Upload signed update APK
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-QUANTUM-AI-signed-update-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
      # Create separately verified binary patches for the 5 most recent compatible release APKs to keep CI bounded.
      - name: Download recent signed base APKs
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p delta-bases delta-output
          gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName > "$RUNNER_TEMP/releases.json"
          python3 - "$RUNNER_TEMP/releases.json" "$GITHUB_RUN_NUMBER" <<'PY'
          import json,re,sys
          rows=json.load(open(sys.argv[1])); target=int(sys.argv[2]); tags=[]
          for r in rows:
              m=re.fullmatch(r"astra-build-(\d+)",r.get("tagName",""))
              if m and int(m.group(1))<target: tags.append((int(m.group(1)),r["tagName"]))
          tags.sort(reverse=True)
          open("delta-bases/tags.txt","w").writelines(f"{n} {t}\n" for n,t in tags[:5])
          PY
          while read -r N TAG; do
            mkdir -p "delta-bases/$N"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern ASTRA-QUANTUM-AI.apk --dir "delta-bases/$N" || rm -rf "delta-bases/$N"
          done < delta-bases/tags.txt
          mkdir -p delta-bases/150
          gh run download 43903146328 --repo "$GITHUB_REPOSITORY" --name ASTRA-QUANTUM-AI-signed-update-apk --dir delta-bases/150 || true
      - name: Create and verify multi-base APK deltas
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y bsdiff
          NEW_APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$NEW_APK" > new-cert.txt
          NEW_CERT="$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' new-cert.txt | head -n 1)"
          NEW_HASH="$(sha256sum "$NEW_APK" | cut -d ' ' -f 1)"
          export NEW_APK NEW_CERT NEW_HASH APKSIGNER
          python3 <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path("delta-output"); patches=[]
          for base in sorted(pathlib.Path("delta-bases").glob("*/*.apk"),key=lambda p:int(p.parent.name),reverse=True):
              try: build=int(base.parent.name)
              except ValueError: continue
              cert=subprocess.check_output([os.environ["APKSIGNER"],"verify","--print-certs",str(base)],text=True,stderr=subprocess.STDOUT)
              signer=next((x.split(": ",1)[1].strip() for x in cert.splitlines() if "Signer #1 certificate SHA-256 digest:" in x),"")
              if signer.lower()!=os.environ["NEW_CERT"].lower(): continue
              name=f"ASTRA-build{build}-to-{os.environ['GITHUB_RUN_NUMBER']}.patch"; patch=out/name
              subprocess.run(["bsdiff",str(base),os.environ["NEW_APK"],str(patch)],check=True)
              rebuilt=out/f"verify-{build}.apk"; subprocess.run(["bspatch",str(base),str(rebuilt),str(patch)],check=True)
              good=hashlib.sha256(rebuilt.read_bytes()).hexdigest()==os.environ["NEW_HASH"]; rebuilt.unlink()
              if not good: raise SystemExit(f"Patch verification failed for base {build}")
              patches.append({"baseBuild":build,"baseApkSha256":hashlib.sha256(base.read_bytes()).hexdigest(),"patchFile":name,"patchSizeBytes":patch.stat().st_size,"patchSha256":hashlib.sha256(patch.read_bytes()).hexdigest()})
          if not patches: raise SystemExit("No compatible signed base APKs; release blocked.")
          json.dump(patches,open(out/"patches.json","w"),indent=2)
          print("Verified multi-base patches:",len(patches))
          PY
      - name: Create and sign multi-base update metadata
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        shell: bash
        env:
          ASTRA_KEYSTORE_PATH: ${{ runner.temp }}/keystore/astra-upload.jks
        run: |
          set -euo pipefail
          NEW_APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          cp "$NEW_APK" delta-output/ASTRA-QUANTUM-AI.apk
          TAG="astra-build-${GITHUB_RUN_NUMBER}"
          python3 - "$TAG" <<'PY'
          import glob,hashlib,json,os,subprocess,sys
          base=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{sys.argv[1]}/"
          patches=json.load(open("delta-output/patches.json"))
          for p in patches: p["patchUrl"]=base+p["patchFile"]
          apk=glob.glob("app/build/outputs/apk/release/**/*.apk",recursive=True)[0]
          cert=subprocess.check_output(["openssl","x509","-in","app/src/main/assets/update_signer.pem","-outform","DER"])
          legacy=next((p for p in patches if p["baseBuild"]==194),patches[0])
          data={"packageName":"com.bittupandit.astraquantumai","targetVersionCode":int(os.environ["GITHUB_RUN_NUMBER"]),"targetVersionName":"1.0."+os.environ["GITHUB_RUN_NUMBER"],"targetApkSha256":hashlib.sha256(open(apk,"rb").read()).hexdigest(),"signerCertificateSha256":hashlib.sha256(cert).hexdigest(),"apkUrl":base+"ASTRA-QUANTUM-AI.apk","patches":patches,"baseApkSha256":legacy["baseApkSha256"],"patchUrl":legacy["patchUrl"],"patchSha256":legacy["patchSha256"]}
          json.dump(data,open("delta-output/UPDATE-METADATA.json","w"),separators=(",",":"),sort_keys=True)
          PY
          cat > "$RUNNER_TEMP/SignUpdateMetadata.java" <<'JAVA'
          import java.nio.file.*; import java.security.*; import java.util.Base64; import java.io.*;
          public class SignUpdateMetadata { public static void main(String[] a) throws Exception {
            KeyStore ks=null; Exception last=null;
            for(String t:new String[]{"PKCS12","JKS"}) try { ks=KeyStore.getInstance(t); try(InputStream in=new FileInputStream(a[0])){ks.load(in,a[1].toCharArray());} break; } catch(Exception e){last=e;ks=null;}
            if(ks==null) throw last; PrivateKey k=(PrivateKey)ks.getKey(a[2],a[3].toCharArray());
            Signature s=Signature.getInstance(k.getAlgorithm().equalsIgnoreCase("RSA")?"SHA256withRSA":"SHA256withECDSA");
            s.initSign(k); s.update(Files.readAllBytes(Path.of(a[4]))); Files.writeString(Path.of(a[5]),Base64.getEncoder().encodeToString(s.sign()));
          }}
          JAVA
          javac "$RUNNER_TEMP/SignUpdateMetadata.java"
          java -cp "$RUNNER_TEMP" SignUpdateMetadata "$ASTRA_KEYSTORE_PATH" "$ASTRA_KEYSTORE_PASSWORD" "$ASTRA_KEY_ALIAS" "$ASTRA_KEY_PASSWORD" delta-output/UPDATE-METADATA.json delta-output/UPDATE-METADATA.sig
          openssl x509 -in app/src/main/assets/update_signer.pem -pubkey -noout > "$RUNNER_TEMP/update-public.pem"
          base64 -d delta-output/UPDATE-METADATA.sig > "$RUNNER_TEMP/update-signature.bin"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/update-public.pem" -signature "$RUNNER_TEMP/update-signature.bin" delta-output/UPDATE-METADATA.json
      - name: Publish verified multi-base update release
        if: github.ref == 'refs/heads/main' && env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="astra-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" delta-output/*.patch delta-output/UPDATE-METADATA.json delta-output/UPDATE-METADATA.sig delta-output/ASTRA-QUANTUM-AI.apk --repo "$GITHUB_REPOSITORY" --title "ASTRA QUANTUM AI PLUS Build ${GITHUB_RUN_NUMBER}" --notes "Signed per-build delta patches for the 20 most recent compatible releases. Full APK fallback only." --latest --target "$GITHUB_SHA"

      - name: Upload verified APK binary delta
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-QUANTUM-AI-APK-DELTA-multi-base
          path: |
            delta-output/*.patch
            delta-output/UPDATE-METADATA.json
            delta-output/UPDATE-METADATA.sig
            delta-output/ASTRA-QUANTUM-AI.apk
          if-no-files-found: error
          retention-days: 90
