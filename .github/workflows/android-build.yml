name: ASTRA Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "backend/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ASTRA APKs
    runs-on: ubuntu-latest
    env:
      ASTRA_KEYSTORE_BASE64: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
      ASTRA_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
      ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
      ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create changed-files source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess, zipfile
          from pathlib import Path
          out = Path('patch-output')
          out.mkdir(exist_ok=True)
          raw = subprocess.check_output(['git', 'diff', '--name-status', '-z', 'HEAD^', 'HEAD'])
          parts = raw.decode('utf-8', 'surrogateescape').split(chr(0))
          entries, i = [], 0
          while i < len(parts) and parts[i]:
              status = parts[i]; i += 1
              if status.startswith(('R', 'C')):
                  old, new = parts[i], parts[i+1]; i += 2
                  entries.append((status, old, new))
              else:
                  name = parts[i]; i += 1
                  entries.append((status, name, name))
          manifest = ['ASTRA QUANTUM AI PLUS - SOURCE PATCH', '', 'Overlay included files onto the same repository root.', 'Deleted files are listed below and must be removed manually if applying by hand.', '']
          included = []
          with zipfile.ZipFile(out / 'ASTRA-SOURCE-PATCH.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for status, old, new in entries:
                  if status.startswith('D'):
                      manifest.append(f'DELETED: {old}')
                      continue
                  if new.startswith('.git/') or Path(new).name in ('.env', '.env.local') or new.endswith(('.jks', '.keystore')):
                      manifest.append(f'SKIPPED (sensitive): {new}')
                      continue
                  p = Path(new)
                  if p.is_file():
                      z.write(p, new)
                      included.append(new)
                      manifest.append(f'INCLUDED: {new}')
              z.writestr('PATCH-MANIFEST.txt', chr(10).join(manifest) + chr(10))
          print('Patch files:', len(included))
          print('Patch archive:', out / 'ASTRA-SOURCE-PATCH.zip')
          PY

      - name: Upload changed-files source patch
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-SOURCE-PATCH
          path: patch-output/ASTRA-SOURCE-PATCH.zip
          if-no-files-found: error
          retention-days: 90

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check backend JavaScript syntax
        run: node --check backend/server.js

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake for BSDIFF engine
        run: yes | sdkmanager --install "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # Keep a usable debug build available even if release signing needs repair.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-QUANTUM-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare persistent release signing key
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ASTRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/astra-upload.jks"
          test -s "$RUNNER_TEMP/keystore/astra-upload.jks"

      - name: Validate persistent release signing credentials
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        shell: bash
        run: |
          # Discover the real alias from the keystore instead of trusting a possibly stale alias secret.
          if ! keytool -list -v -keystore "$RUNNER_TEMP/keystore/astra-upload.jks" -storepass "$ASTRA_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore/list.txt" 2> "$RUNNER_TEMP/keystore/list-error.txt"; then
            echo "::error::The GitHub ASTRA_KEYSTORE_PASSWORD secret does not unlock this keystore. The alias was not the cause."
            exit 1
          fi
          alias="$(sed -n 's/^Alias name: //p' "$RUNNER_TEMP/keystore/list.txt" | head -n 1)"
          if [ -z "$alias" ]; then
            echo "::error::The keystore opened, but no private-key alias was found."
            exit 1
          fi
          echo "Detected signing alias: $alias"
          echo "ASTRA_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          # Do not use keytool -keypasswd as a password probe: it is unsupported
          # for PKCS12 keystores on some JDKs. Gradle's release signing task is
          # the authoritative check for the private-key password.
          rm -f "$RUNNER_TEMP/keystore/list.txt" "$RUNNER_TEMP/keystore/list-error.txt"
          echo "Keystore password and signing alias validated; Gradle will verify the private-key password during assembleRelease."

      - name: Build permanently signed release APK
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        env:
          ASTRA_KEYSTORE_PATH: ${{ runner.temp }}/keystore/astra-upload.jks
        run: gradle --no-daemon assembleRelease

      - name: Upload signed update APK
        if: env.ASTRA_KEYSTORE_BASE64 != '' && env.ASTRA_KEYSTORE_PASSWORD != '' && env.ASTRA_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-QUANTUM-AI-signed-update-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
