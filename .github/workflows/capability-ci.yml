name: QUANTUM AI Capability CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "backend/**"
      - "docs/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/capability-ci.yml"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/knowledge-base-tests.yml"

permissions:
  contents: read

concurrency:
  group: quantum-capability-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Backend syntax and tests
        run: |
          node --check backend/server.js
          npm test --prefix backend

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
