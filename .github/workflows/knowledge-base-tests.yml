name: Knowledge Base Tests

on:
  pull_request:
    paths:
      - "backend/knowledge.js"
      - "backend/server.js"
      - "backend/research-quality.js"
      - "backend/research-quality.test.js"
      - "backend/knowledge.test.js"
      - "backend/package.json"
      - "knowledge-base/**"
      - "knowledge-base/README.md"
      - "knowledge-base/sources/**"
      - ".github/workflows/knowledge-base-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/knowledge.js"
      - "backend/server.js"
      - "backend/research-quality.js"
      - "backend/research-quality.test.js"
      - "backend/knowledge.test.js"
      - "backend/package.json"
      - "knowledge-base/**"
      - ".github/workflows/knowledge-base-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run knowledge retrieval tests
        run: npm test --prefix backend
